name: Deploy Backend to Hugging Face Spaces

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Clone the HF Space repo (which contains the HF git history)
          git clone "https://user:$HF_TOKEN@huggingface.co/spaces/sambhavvoswal/deskmate-api" hf_space
          
          # Navigate to cloned repository
          cd hf_space
          
          # Clean existing files (except .git)
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          
          # Copy backend files from github checkout
          cp -r ../backend/* .
          
          # Commit and push changes if any exist
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy from GitHub Actions: ${{ github.sha }}"
            git push origin main --force
          fi
